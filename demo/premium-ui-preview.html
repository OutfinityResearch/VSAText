<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCRIPTA Premium UI Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090f1f;
      --bg-soft: #101a32;
      --panel: rgba(16, 25, 46, 0.78);
      --panel-strong: rgba(15, 22, 40, 0.92);
      --line: rgba(180, 196, 230, 0.18);
      --text: #eef3ff;
      --muted: #b3bfdc;
      --accent: #f1c574;
      --accent-2: #ef9e57;
      --good: #69d0a7;
      --shadow: 0 20px 48px rgba(2, 6, 18, 0.42);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Manrope, sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(241, 197, 116, 0.2), transparent 28%),
        radial-gradient(circle at 84% 14%, rgba(110, 154, 255, 0.17), transparent 30%),
        linear-gradient(135deg, #070d1d, #0c162b 45%, #0a1223);
    }

    .app {
      width: min(1440px, calc(100vw - 28px));
      margin: 14px auto;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 8%), var(--panel-strong);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 18, 35, 0.92);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: #261507;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
    }

    .brand h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 23px;
      letter-spacing: 0.03em;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid rgba(188, 204, 236, 0.28);
      background: rgba(25, 36, 63, 0.82);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      letter-spacing: 0.03em;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: rgba(241, 197, 116, 0.7); }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #2a1708; border-color: transparent; }
    .btn.small { padding: 6px 10px; font-size: 11px; }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      min-height: calc(100vh - 118px);
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(15, 25, 47, 0.82), rgba(10, 16, 32, 0.88));
      padding: 14px;
      overflow: auto;
    }

    .sidebar-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #d8def2;
      margin: 6px 2px 10px;
      font-family: "IBM Plex Mono", monospace;
    }

    details.group {
      border: 1px solid rgba(162, 182, 226, 0.24);
      border-radius: 12px;
      margin-bottom: 10px;
      background: rgba(16, 26, 49, 0.6);
      overflow: hidden;
    }

    details.group > summary {
      list-style: none;
      cursor: pointer;
      padding: 11px 12px;
      font-weight: 700;
      color: #f7f9ff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    details.group > summary::-webkit-details-marker { display: none; }

    .sub {
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding: 4px 6px 8px;
    }

    .sub-title {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 8px 6px 6px;
    }

    .leaf {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: #dce6ff;
      border-radius: 9px;
      padding: 8px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .leaf:hover, .leaf.active {
      border-color: rgba(241, 197, 116, 0.52);
      background: rgba(45, 62, 105, 0.34);
    }

    .workspace {
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(130deg, rgba(23, 36, 66, 0.86), rgba(13, 21, 39, 0.86));
      padding: 16px;
    }

    .hero h2 {
      margin: 0 0 6px;
      font-family: "Playfair Display", serif;
      font-size: 28px;
      color: #fff5e0;
    }

    .hero p { margin: 0; color: #c7d3f2; font-size: 13px; }

    .toolbar {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(14, 23, 44, 0.84);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar .context { color: #d6def6; font-size: 13px; }
    .toolbar .context strong { color: #fff; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .card {
      border: 1px solid rgba(167, 187, 228, 0.25);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(21, 33, 62, 0.82), rgba(13, 21, 42, 0.86));
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-height: 220px;
    }

    .card h3 { margin: 0 0 6px; font-size: 16px; color: #fff; }
    .card p { margin: 0; color: #c8d4f4; font-size: 12px; line-height: 1.46; }

    .chips {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid rgba(168, 188, 232, 0.34);
      border-radius: 999px;
      font-size: 10px;
      padding: 3px 8px;
      color: #d8e2ff;
      background: rgba(25, 37, 68, 0.74);
    }

    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 8px;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: rgba(12, 20, 36, 0.94);
      color: #eef3ff;
      border: 1px solid rgba(105, 208, 167, 0.52);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      transform: translateY(12px);
      opacity: 0;
      pointer-events: none;
      transition: all .24s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1040px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); max-height: 340px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <h1>SCRIPTA Premium Preview</h1>
      </div>
      <div class="actions">
        <button class="btn">New</button>
        <button class="btn primary">Library</button>
        <button class="btn">Load</button>
        <button class="btn">Evaluate</button>
        <button class="btn">Docs</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="workspace">
        <section class="hero">
          <h2 id="title">Wisdom / Philosophical Traditions</h2>
          <p id="subtitle">Premium preview for a cleaner and more elegant library experience.</p>
        </section>
        <section class="toolbar">
          <div class="context">Current Scope: <strong id="scope">Book</strong></div>
          <div>
            <button class="btn small" data-scope="Book">Book</button>
            <button class="btn small" data-scope="Chapter">Chapter</button>
          </div>
        </section>
        <section class="cards" id="cards"></section>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const state = { section: 'wisdom:traditions', scope: 'Book' };

    const DATA = {
      wisdom: {
        label: 'Wisdom',
        groups: {
          traditions: { label: 'Philosophical Traditions', items: ['Stoicism', 'Buddhism', 'Existentialism', 'Taoism'] },
          moral: { label: 'Moral Insights', items: ['Justice', 'Responsibility', 'Compassion', 'Integrity'] },
          psychological: { label: 'Psychological Insights', items: ['Resilience', 'Trauma Recovery', 'Cognitive Bias', 'Motivation'] },
          scientific: { label: 'Scientific Insights', items: ['Entropy', 'Evolution', 'Systems Thinking', 'Emergence'] },
          humanist: { label: 'Humanist Principles', items: ['Dignity', 'Dialogue', 'Pluralism', 'Empathy'] },
          lessons: { label: 'Life Lessons', items: ['Courage under pressure', 'Limits of control', 'Trust and betrayal', 'Loss and meaning'] }
        }
      },
      themes: {
        label: 'Themes',
        groups: {
          personal: { label: 'Personal Transformation', items: ['Redemption', 'Identity', 'Growth', 'Truth'] },
          power: { label: 'Power and Conflict', items: ['Power', 'Corruption', 'Ambition', 'Justice'] },
          bonds: { label: 'Human Bonds', items: ['Love', 'Sacrifice', 'Family', 'Betrayal'] },
          survival: { label: 'Survival and Existence', items: ['Survival', 'Mortality', 'Hope vs Despair', 'Fate vs Free Will'] },
          society: { label: 'Society and World', items: ['Freedom', 'Class and Society', 'Nature vs Civilization', 'Nature vs Nurture'] }
        }
      },
      narrative: {
        label: 'Narrative Design',
        groups: {
          patterns: { label: 'Patterns', items: ["Hero's Journey", 'Quest', 'Rebirth', 'Revenge'] },
          templates: { label: 'Templates', items: ['Three Act Spine', 'Slow Burn Arc', 'Dual Timeline', 'Mirrored Journey'] },
          blocks: { label: 'Blocks', items: ['Call to Adventure', 'Refusal', 'Ordeal', 'Return'] }
        }
      }
    };

    const sidebar = document.getElementById('sidebar');
    const cards = document.getElementById('cards');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const scope = document.getElementById('scope');
    const toast = document.getElementById('toast');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1300);
    }

    function renderSidebar() {
      sidebar.innerHTML = `
        <div class="sidebar-title">Library</div>
        ${Object.entries(DATA).map(([k, section]) => `
          <details class="group" open>
            <summary>${section.label}</summary>
            <div class="sub">
              ${Object.entries(section.groups).map(([gk, group]) => `
                <button class="leaf ${state.section === `${k}:${gk}` ? 'active' : ''}" data-section="${k}:${gk}">
                  ${group.label}
                </button>
              `).join('')}
            </div>
          </details>
        `).join('')}
      `;

      sidebar.querySelectorAll('[data-section]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.section = btn.dataset.section;
          render();
        });
      });
    }

    function renderCards() {
      const [k, gk] = state.section.split(':');
      const section = DATA[k];
      const group = section?.groups[gk];
      if (!group) return;

      title.textContent = `${section.label} / ${group.label}`;
      subtitle.textContent = `${group.items.length} curated items available for reusable narrative construction.`;

      cards.innerHTML = group.items.map(name => `
        <article class="card">
          <h3>${name}</h3>
          <p>Reusable high-value element for narrative planning, semantic consistency, and controlled thematic expression.</p>
          <div class="chips">
            <span class="chip">${section.label}</span>
            <span class="chip">${group.label}</span>
          </div>
          <div class="card-footer">
            <button class="btn small" data-apply="book" data-name="${name}">Apply Book</button>
            <button class="btn small" data-apply="chapter" data-name="${name}">Apply Chapter</button>
          </div>
        </article>
      `).join('');

      cards.querySelectorAll('[data-apply]').forEach(btn => {
        btn.addEventListener('click', () => {
          const where = btn.dataset.apply === 'book' ? 'Book' : 'Chapter';
          showToast(`Applied "${btn.dataset.name}" to ${where}.`);
        });
      });
    }

    document.querySelectorAll('[data-scope]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.scope = btn.dataset.scope;
        scope.textContent = state.scope;
      });
    });

    function render() {
      renderSidebar();
      renderCards();
      scope.textContent = state.scope;
    }

    render();
  </script>
</body>
</html>
