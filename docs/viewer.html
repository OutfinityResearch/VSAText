<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCRIPTA Docs Viewer</title>
  <link rel="stylesheet" href="theory/doc-styles.css">
  <style>
    :root {
      --viewer-bg: #f3ede2;
      --viewer-surface: rgba(255, 251, 245, 0.9);
      --viewer-surface-strong: #fffdf8;
      --viewer-border: rgba(122, 119, 99, 0.16);
      --viewer-border-strong: rgba(73, 122, 120, 0.18);
      --viewer-ink: #263434;
      --viewer-copy: #5d6a66;
      --viewer-muted: #8f816c;
      --viewer-accent: #497a78;
      --viewer-accent-soft: rgba(73, 122, 120, 0.1);
      --viewer-shadow: 0 24px 80px rgba(64, 55, 35, 0.08);
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(232, 223, 204, 0.84), transparent 28%),
        linear-gradient(180deg, #f7f2e8 0%, #efe7d9 100%);
      color: var(--viewer-ink);
      font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 40px 32px 24px;
      border-bottom: 1px solid rgba(122, 119, 99, 0.12);
      background: rgba(249, 244, 236, 0.82);
      backdrop-filter: blur(16px);
    }

    .viewer-header-inner {
      max-width: 1380px;
      margin: 0 auto;
    }

    .viewer-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.42rem 0.82rem;
      border-radius: 999px;
      border: 1px solid rgba(124, 124, 104, 0.18);
      background: rgba(255, 253, 248, 0.78);
      color: #9b8155;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .viewer-kicker::before {
      content: '';
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #d9c6a7, #f1e7d3);
      box-shadow: 0 0 0 0.22rem rgba(185, 161, 119, 0.14);
    }

    header h1 {
      margin: 1.15rem 0 0.72rem;
      font-size: clamp(2.6rem, 5vw, 4.4rem);
      line-height: 1.02;
      letter-spacing: -0.045em;
      color: var(--viewer-ink);
      max-width: 980px;
    }

    header .meta {
      max-width: 960px;
      color: var(--viewer-copy);
      font-size: 1.04rem;
      line-height: 1.7;
    }

    main {
      max-width: 1380px;
      margin: 0 auto;
      padding: 28px 32px 64px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 30px;
      align-items: start;
    }

    .toc {
      position: sticky;
      top: 28px;
      align-self: start;
      padding: 1.4rem 1.25rem 1.2rem;
      border-radius: 24px;
      background: var(--viewer-surface);
      border: 1px solid var(--viewer-border);
      box-shadow: var(--viewer-shadow);
      backdrop-filter: blur(14px);
    }

    .toc-title {
      margin: 0 0 0.32rem;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--viewer-muted);
    }

    .toc-caption {
      margin: 0 0 1.1rem;
      color: var(--viewer-copy);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    #toc-list {
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
      padding-top: 0.2rem;
      border-top: 1px solid rgba(122, 119, 99, 0.14);
    }

    #toc-list > div {
      margin-left: 0 !important;
    }

    .toc a {
      display: block;
      padding: 0.62rem 0.78rem;
      border-radius: 14px;
      color: var(--viewer-copy);
      font-size: 0.94rem;
      line-height: 1.4;
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .toc a:hover {
      background: rgba(73, 122, 120, 0.09);
      color: var(--viewer-accent);
      transform: translateX(2px);
      text-decoration: none;
    }

    .doc {
      padding: clamp(2rem, 5vw, 4.3rem);
      background: var(--viewer-surface-strong);
      border: 1px solid var(--viewer-border);
      border-radius: 30px;
      box-shadow: var(--viewer-shadow);
      min-width: 0;
    }

    .doc img { max-width: 100%; height: auto; border-radius: 18px; }

    .doc h1,
    .doc h2,
    .doc h3,
    .doc h4,
    .doc h5,
    .doc h6 {
      font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--viewer-ink);
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .doc h1 {
      margin: 0 0 1.6rem;
      font-size: clamp(2.2rem, 4.6vw, 3.4rem);
      line-height: 1.06;
      padding-bottom: 1.15rem;
      border-bottom: 1px solid rgba(122, 119, 99, 0.14);
    }

    .doc h2 {
      margin: 3rem 0 1rem;
      font-size: clamp(1.5rem, 3vw, 2.05rem);
      line-height: 1.14;
    }

    .doc h3 {
      margin: 2rem 0 0.78rem;
      font-size: 1.18rem;
      line-height: 1.2;
    }

    .doc p,
    .doc li {
      color: var(--viewer-copy);
      font-size: 1.05rem;
      line-height: 1.86;
    }

    .doc p {
      margin: 0 0 1.25rem;
    }

    .doc ul,
    .doc ol {
      margin: 1.1rem 0 1.5rem 1.3rem;
    }

    .doc li {
      margin-bottom: 0.65rem;
      padding-left: 0.2rem;
    }

    .doc pre {
      background: #f5efe3;
      padding: 1rem 1.1rem;
      border-radius: 18px;
      border: 1px solid rgba(122, 119, 99, 0.12);
      overflow-x: auto;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .doc code {
      font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
      color: #7f6d49;
      background: rgba(217, 198, 167, 0.16);
      border: 1px solid rgba(217, 198, 167, 0.16);
      border-radius: 8px;
      padding: 0.16rem 0.4rem;
    }

    a {
      color: var(--viewer-accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .links {
      margin-top: 1.1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(122, 119, 99, 0.14);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-size: 0.92rem;
    }

    .links a {
      display: block;
      padding: 0.68rem 0.8rem;
      border-radius: 12px;
      background: rgba(73, 122, 120, 0.1);
      color: var(--viewer-accent);
      font-weight: 600;
    }

    .links a:hover {
      background: rgba(73, 122, 120, 0.16);
      text-decoration: none;
    }

    .doc table {
      width: 100%;
      margin: 2.2rem 0;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border: 1px solid rgba(122, 119, 99, 0.14);
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .doc th,
    .doc td {
      padding: 0.95rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(122, 119, 99, 0.1);
      color: var(--viewer-copy);
      font-size: 0.96rem;
      line-height: 1.55;
    }

    .doc th {
      background: #ece4d5;
      color: var(--viewer-ink);
      font-weight: 700;
    }

    .doc tr:last-child td {
      border-bottom: none;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 16px 16px;
      }

      .viewer-kicker {
        font-size: 0.68rem;
        letter-spacing: 0.06em;
      }

      header h1 {
        margin-top: 0.9rem;
        font-size: 2.1rem;
        line-height: 1.06;
      }

      main {
        padding: 14px 14px 40px;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .toc {
        position: static;
        padding: 1rem;
        border-radius: 20px;
      }

      .doc {
        padding: 1.2rem 1rem;
        border-radius: 22px;
      }

      .doc h1 { font-size: 1.9rem; }
      .doc h2 { font-size: 1.42rem; }
      .doc h3 { font-size: 1.08rem; }

      .doc p, .doc li { 
        font-size: 0.98rem; 
        line-height: 1.74;
      }

      .doc pre {
        padding: 0.9rem;
        font-size: 0.82rem;
        border-radius: 14px;
      }

      .doc table {
        display: block;
        overflow-x: auto;
      }

      .doc th, .doc td {
        padding: 0.72rem 0.78rem;
        min-width: 100px;
      }
    }

    @media (min-width: 601px) and (max-width: 1040px) {
      main {
        grid-template-columns: 1fr;
      }

      .toc {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="viewer-header-inner">
      <div class="viewer-kicker">SCRIPTA Specifications</div>
      <h1 id="doc-title">SCRIPTA Docs Viewer</h1>
      <div class="meta" id="doc-meta">Load a document with ?doc=specs/DS01-Vision.md</div>
    </div>
  </header>

  <main>
    <aside class="toc" id="toc">
      <div class="toc-title">On This Page</div>
      <p class="toc-caption">Navigate the current specification quickly and jump between its major sections.</p>
      <div id="toc-list"></div>
      <div class="links" id="doc-links"></div>
    </aside>
    <article class="doc" id="content">Select a document.</article>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const docParam = params.get('doc');
    const contentEl = document.getElementById('content');
    const tocListEl = document.getElementById('toc-list');
    const titleEl = document.getElementById('doc-title');
    const metaEl = document.getElementById('doc-meta');
    const linksEl = document.getElementById('doc-links');

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function slugify(text) {
      return text
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-');
    }

    function resolveUrl(url, baseUrl) {
      if (/^(https?:|data:|mailto:|#)/.test(url)) return url;
      try {
        return new URL(url, baseUrl).href;
      } catch (e) {
        return url;
      }
    }

    function renderMarkdown(md, baseUrl) {
      const lines = md.replace(/\r\n/g, '\n').split('\n');
      let html = '';
      let inCode = false;
      let codeLang = '';
      let codeBuffer = [];
      let paraBuffer = [];
      let listBuffer = [];
      let tableBuffer = [];
      let inTable = false;
      const headings = [];

      function flushParagraph() {
        if (paraBuffer.length) {
          const text = paraBuffer.join(' ');
          html += `<p>${inline(text, baseUrl)}</p>`;
          paraBuffer = [];
        }
      }

      function flushList() {
        if (listBuffer.length) {
          html += '<ul>' + listBuffer.map(item => `<li>${inline(item, baseUrl)}</li>`).join('') + '</ul>';
          listBuffer = [];
        }
      }

      function flushCode() {
        if (codeBuffer.length) {
          const code = escapeHtml(codeBuffer.join('\n'));
          const langClass = codeLang ? ` class="language-${escapeHtml(codeLang)}"` : '';
          html += `<pre><code${langClass}>${code}</code></pre>`;
          codeBuffer = [];
          codeLang = '';
        }
      }

      function flushTable() {
        if (tableBuffer.length < 2) {
          tableBuffer = [];
          inTable = false;
          return;
        }
        
        // Parse header row
        const headerRow = tableBuffer[0];
        const headerCells = parseTableRow(headerRow);
        
        // Skip separator row (index 1)
        // Parse data rows (index 2+)
        const dataRows = tableBuffer.slice(2);
        
        let tableHtml = '<table><thead><tr>';
        for (const cell of headerCells) {
          tableHtml += `<th>${inline(cell.trim(), baseUrl)}</th>`;
        }
        tableHtml += '</tr></thead><tbody>';
        
        for (const row of dataRows) {
          const cells = parseTableRow(row);
          tableHtml += '<tr>';
          for (let i = 0; i < headerCells.length; i++) {
            const cellContent = cells[i] !== undefined ? cells[i].trim() : '';
            tableHtml += `<td>${inline(cellContent, baseUrl)}</td>`;
          }
          tableHtml += '</tr>';
        }
        
        tableHtml += '</tbody></table>';
        html += tableHtml;
        
        tableBuffer = [];
        inTable = false;
      }

      function parseTableRow(row) {
        // Remove leading/trailing pipes and split by pipe
        let trimmed = row.trim();
        if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
        if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
        return trimmed.split('|');
      }

      function isTableSeparator(line) {
        // Matches |---|---|---| or |:---|:---:|---:|
        return /^\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?$/.test(line.trim());
      }

      function isTableRow(line) {
        const trimmed = line.trim();
        return trimmed.startsWith('|') && trimmed.endsWith('|') && trimmed.includes('|');
      }

      function inline(text, baseUrlLocal) {
        let t = escapeHtml(text);
        t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, alt, url) => {
          const safeAlt = escapeHtml(alt);
          const resolved = resolveUrl(url, baseUrlLocal);
          return `<img src="${resolved}" alt="${safeAlt}" />`;
        });
        t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, url) => {
          const resolved = resolveUrl(url, baseUrlLocal);
          return `<a href="${resolved}">${label}</a>`;
        });
        t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
        t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        return t;
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        
        // Skip chapter anchor tags completely
        if (trimmed.includes('<a id="chapter-chapter-') || trimmed.includes('<a name="chapter-')) {
          continue;
        }

        // Code blocks
        if (trimmed.startsWith('```')) {
          if (!inCode) {
            flushParagraph();
            flushList();
            flushTable();
            inCode = true;
            codeLang = trimmed.replace('```', '').trim();
          } else {
            inCode = false;
            flushCode();
          }
          continue;
        }
        if (inCode) {
          codeBuffer.push(line);
          continue;
        }
        
        // Table detection
        if (isTableRow(trimmed)) {
          if (!inTable) {
            // Check if next line is separator
            const nextLine = lines[i + 1];
            if (nextLine && isTableSeparator(nextLine)) {
              flushParagraph();
              flushList();
              inTable = true;
              tableBuffer.push(trimmed);
              continue;
            }
          }
          if (inTable) {
            tableBuffer.push(trimmed);
            continue;
          }
        }
        
        // Table separator (only when in table)
        if (inTable && isTableSeparator(trimmed)) {
          tableBuffer.push(trimmed);
          continue;
        }
        
        // End of table (non-table line while in table)
        if (inTable && !isTableRow(trimmed) && !isTableSeparator(trimmed)) {
          flushTable();
        }
        
        // Headings
        if (/^#{1,6}\s/.test(trimmed)) {
          flushParagraph();
          flushList();
          flushTable();
          const level = trimmed.match(/^#+/)[0].length;
          const text = trimmed.replace(/^#{1,6}\s+/, '').trim();
          const id = slugify(text);
          headings.push({ level, text, id });
          html += `<h${level} id="${id}">${inline(text, baseUrl)}</h${level}>`;
          continue;
        }

        // HTML Comments (ignore them)
        if (trimmed.startsWith('<!--') && trimmed.endsWith('-->')) {
          flushParagraph();
          continue;
        }

        // HTML Tags on their own line (like <a id="..."></a>)
        if (/^(<[^>]+>)+$/i.test(trimmed)) {
          flushParagraph();
          flushList();
          flushTable();
          html += trimmed;
          continue;
        }
        
        // List items
        if (/^[-*]\s+/.test(trimmed)) {
          flushParagraph();
          flushTable();
          listBuffer.push(trimmed.replace(/^[-*]\s+/, ''));
          continue;
        }
        
        // Empty line
        if (trimmed === '') {
          flushParagraph();
          flushList();
          if (inTable) flushTable();
          continue;
        }
        
        // Regular paragraph text
        paraBuffer.push(trimmed);
      }
      
      flushParagraph();
      flushList();
      flushCode();
      flushTable();

      return { html, headings };
    }

    async function loadDoc() {
      if (!docParam) {
        contentEl.textContent = 'No document specified.';
        return;
      }
      try {
        const docUrl = new URL(docParam, window.location.href);
        const res = await fetch(docUrl);
        if (!res.ok) throw new Error('Failed to load document');
        const md = await res.text();
        const { html, headings } = renderMarkdown(md, docUrl.href);
        contentEl.innerHTML = html;
        titleEl.textContent = docParam.split('/').pop();
        metaEl.textContent = docParam;
        tocListEl.innerHTML = headings.map(h => {
          const indent = (h.level - 1) * 12;
          return `<div style="margin-left:${indent}px"><a href="#${h.id}">${h.text}</a></div>`;
        }).join('');
        linksEl.innerHTML = `
          <a href="${docUrl.href}">Raw .md</a>
          <a href="index.html">Index</a>
        `;
      } catch (err) {
        contentEl.textContent = 'Unable to load document: ' + err.message;
      }
    }

    loadDoc();
  </script>
</body>
</html>
